<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MartPoint Retail - Offline</title>
  <link rel="stylesheet" href="theme/bootstrap/css/bootstrap.min.css">
  <style>
    body {
      background: #0B1120;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .offline-box {
      text-align: center;
      max-width: 400px;
      padding: 40px;
    }
    .offline-icon {
      font-size: 64px;
      color: #f39c12;
      margin-bottom: 20px;
    }
    .offline-box h2 {
      margin: 0 0 15px;
      font-weight: 300;
    }
    .offline-box p {
      color: #aaa;
      margin-bottom: 25px;
    }
    .btn-retry {
      background: #f39c12;
      color: #0B1120;
      border: none;
      padding: 10px 30px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-retry:hover {
      background: #e08e0b;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e74c3c;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
      70% { opacity: 0.8; box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
      100% { opacity: 1; box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">
      <span class="glyphicon glyphicon-signal" aria-hidden="true"></span>
    </div>
    <h2><span class="status-dot"></span>You're Offline</h2>
    <p>Your internet connection is unavailable. MartPoint Retail is running in offline mode.</p>
    <p style="font-size: 13px; color: #888;">Some features may be limited until connectivity is restored.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
